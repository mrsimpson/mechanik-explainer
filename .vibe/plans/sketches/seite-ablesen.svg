<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" width="360" height="300" role="img" aria-labelledby="t d">
  <title id="t">Skizze: Seite "Ablesen"</title>
  <desc id="d">Messzylinder mit Wasserstand zwischen zwei Strichen, daneben die Frage und ein Eingabefeld mit Einheit.</desc>
  <rect width="360" height="300" fill="#fff" stroke="#999"/>
  <text x="12" y="24" font-family="sans-serif" font-size="14" font-weight="bold">Ablesen: Messzylinder</text>
  <rect x="40" y="40" width="50" height="230" fill="none" stroke="#333" stroke-width="2"/>
  <rect x="42" y="150" width="46" height="118" fill="#bde"/>
  <g stroke="#333"><line x1="90" y1="60" x2="110" y2="60"/><line x1="90" y1="100" x2="110" y2="100"/><line x1="90" y1="140" x2="110" y2="140"/><line x1="90" y1="180" x2="110" y2="180"/><line x1="90" y1="220" x2="110" y2="220"/></g>
  <g font-family="sans-serif" font-size="11"><text x="114" y="64">100</text><text x="114" y="104">80</text><text x="114" y="144">60</text><text x="114" y="184">40</text><text x="114" y="224">20</text><text x="94" y="285">ml</text></g>
  <text x="170" y="70" font-family="sans-serif" font-size="13">Wie viel Wasser ist im Zylinder?</text>
  <rect x="170" y="90" width="80" height="28" fill="none" stroke="#333"/><text x="180" y="109" font-family="sans-serif" font-size="13" fill="#888">Zahl</text>
  <rect x="258" y="90" width="70" height="28" fill="none" stroke="#333"/><text x="266" y="109" font-family="sans-serif" font-size="13" fill="#888">Einheit</text>
  <rect x="170" y="130" width="90" height="30" fill="#ddd" stroke="#333"/><text x="182" y="150" font-family="sans-serif" font-size="13">Prüfen</text>
  <text x="170" y="190" font-family="sans-serif" font-size="12" fill="#555">Rückmeldung z. B.: "Ein Strich ist 4 ml,</text>
  <text x="170" y="206" font-family="sans-serif" font-size="12" fill="#555">nicht 1 ml. Zähle die Striche."</text>
</svg>
