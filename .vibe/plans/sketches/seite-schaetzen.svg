<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="t d">
  <title id="t">Skizze: Seite "Schätzen"</title>
  <desc id="d">Zwei Rechtecke als Flächenvergleich, Saarland klein neben Portugal groß, ohne Zahlen. Darunter Schätzfrage und Eingabefeld.</desc>
  <rect width="360" height="260" fill="#fff" stroke="#999"/>
  <text x="12" y="24" font-family="sans-serif" font-size="14" font-weight="bold">Schätzen: Wie oft passt es hinein?</text>
  <rect x="12" y="44" width="40" height="40" fill="#bde" stroke="#333"/><text x="12" y="100" font-family="sans-serif" font-size="12">Saarland</text>
  <rect x="120" y="44" width="230" height="130" fill="#dcb" stroke="#333"/><text x="125" y="190" font-family="sans-serif" font-size="12">Portugal (Maßstab nicht genau)</text>
  <text x="12" y="218" font-family="sans-serif" font-size="13">Wie viele Saarländer-Flächen passen in Portugal?</text>
  <rect x="12" y="226" width="90" height="26" fill="none" stroke="#333"/><text x="22" y="244" font-family="sans-serif" font-size="12" fill="#888">Schätzung</text>
  <text x="112" y="244" font-family="sans-serif" font-size="11" fill="#555">Danach: Wert + Quelle; "Zehnerpotenz daneben?"</text>
</svg>
