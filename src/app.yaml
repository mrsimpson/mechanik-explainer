title: Körper und Größen
intro: |
  Körper haben Eigenschaften, die du messen kannst: Länge, Volumen und Masse. Hier schätzt, liest du ab und
  rechnest um, mit neuen Aufgaben, so oft du willst. Für Klasse 7.
